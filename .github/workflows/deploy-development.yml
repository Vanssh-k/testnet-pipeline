name: Deploy to Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

      - name: Deploy to Ubuntu instance
        run: |
          # Create .env file for docker-compose
          cat > .env << 'EOF'
          PORT=${{ secrets.PORT }}
          ENVIRONMENT=${{ secrets.ENVIRONMENT }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          TEST_WALLET1_PRIVATE_KEY=${{ secrets.TEST_WALLET1_PRIVATE_KEY }}
          TEST_WALLET2_PRIVATE_KEY=${{ secrets.TEST_WALLET2_PRIVATE_KEY }}
          TEST_WALLET3_PRIVATE_KEY=${{ secrets.TEST_WALLET3_PRIVATE_KEY }}
          TEST_WALLET4_PRIVATE_KEY=${{ secrets.TEST_WALLET4_PRIVATE_KEY }}
          TEST_WALLET5_PRIVATE_KEY=${{ secrets.TEST_WALLET5_PRIVATE_KEY }}
          TEST_WALLET6_PRIVATE_KEY=${{ secrets.TEST_WALLET6_PRIVATE_KEY }}
          TEST_WALLET6_API_KEY=${{ secrets.TEST_WALLET6_API_KEY }}
          TEST_WALLET7_API_KEY=${{ secrets.TEST_WALLET7_API_KEY }}
          TEST_WALLET7_API_KEY_DEVELOPMENT=${{ secrets.TEST_WALLET7_API_KEY_DEVELOPMENT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          LIGHTHOUSE_IPNS_NODE=${{ secrets.LIGHTHOUSE_IPNS_NODE }}
          LIGHTHOUSE_PUBLIC_NODE_TOKEN=${{ secrets.LIGHTHOUSE_PUBLIC_NODE_TOKEN }}
          ROUTE_ACCESS_TOKEN=${{ secrets.ROUTE_ACCESS_TOKEN }}
          TRANSACTION_ROUTE_TOKEN=${{ secrets.TRANSACTION_ROUTE_TOKEN }}
          POLYGON_RPC=${{ secrets.POLYGON_RPC }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          LIGHTHOUSE_BILLING_ADDRESS=${{ secrets.LIGHTHOUSE_BILLING_ADDRESS }}
          LIGHTHOUSE_ENC_MESSAGE_TOKENS=${{ secrets.LIGHTHOUSE_ENC_MESSAGE_TOKENS }}
          SMTP_EMAIL_HOST=${{ secrets.SMTP_EMAIL_HOST }}
          SMTP_EMAIL_PASSWORD=${{ secrets.SMTP_EMAIL_PASSWORD }}
          SMTP_EMAIL_ID=${{ secrets.SMTP_EMAIL_ID }}
          STRIPE_KEY=${{ secrets.STRIPE_KEY }}
          PAYMENT_URL=${{ secrets.PAYMENT_URL }}
          STRIPE_WEBHOOK=${{ secrets.STRIPE_WEBHOOK }}
          LIGHTHOUSE_COREUM_ADDRESS=${{ secrets.LIGHTHOUSE_COREUM_ADDRESS }}
          FILECOIN_RPC=${{ secrets.FILECOIN_RPC }}
          RADIX_DAPP_DEFINATION=${{ secrets.RADIX_DAPP_DEFINATION }}
          RADIX_NETWORK_ID=${{ secrets.RADIX_NETWORK_ID }}
          RADIX_EXPECTED_ORIGIN=${{ secrets.RADIX_EXPECTED_ORIGIN }}
          LIGHTHOUSE_RADIX_ADDRESS=${{ secrets.LIGHTHOUSE_RADIX_ADDRESS }}
          EOF
          
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "Starting deployment..."
          
          # Create application directory if it doesn't exist
          sudo mkdir -p /opt/lighthouse-backend
          sudo chown ubuntu:ubuntu /opt/lighthouse-backend
          
          # Fix Docker permissions
          sudo usermod -aG docker ubuntu || true
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          # Navigate to application directory
          cd /opt/lighthouse-backend
          
          # Clone or pull the repository
          if [ ! -d ".git" ]; then
            echo "Cloning repository..."
            git clone https://${{ secrets.TOKEN_GITHUB_DEPLOY }}@github.com/Vanssh-k/testnet-pipeline.git .
          else
            echo "Pulling latest changes..."
            # Configure git to use token for all operations
            git remote set-url origin https://${{ secrets.TOKEN_GITHUB_DEPLOY }}@github.com/Vanssh-k/testnet-pipeline.git
            git fetch origin
            git reset --hard origin/development
          fi
          
          # Stop existing containers
          sudo docker-compose down || true
          
          # Remove old images
          sudo docker rmi lighthouse-backend:latest || true
          
          # Start services using docker-compose
          sudo docker-compose up -d --build
          
          echo "Deployment completed successfully!"
          EOF
          
          # Create directory on server first
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo mkdir -p /opt/lighthouse-backend && sudo chown ubuntu:ubuntu /opt/lighthouse-backend"
          
          # Copy .env file to server
          scp -o StrictHostKeyChecking=no -i private_key .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/lighthouse-backend/
          
          # Copy deployment script to server
          scp -o StrictHostKeyChecking=no -i private_key deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          
          # Execute deployment on server using the SSH key file
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSHEOF'
            # Make deployment script executable and run
            chmod +x /tmp/deploy.sh
            /tmp/deploy.sh
          SSHEOF

      - name: Health check
        run: |
          sleep 30
          curl -f http://${{ secrets.SSH_HOST }}:13001/health || exit 1 