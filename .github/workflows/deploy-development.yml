name: Deploy to Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

      - name: Deploy to Ubuntu instance
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "Starting deployment..."
          
          # Fix Docker permissions
          sudo usermod -aG docker ubuntu || true
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          # Navigate to application directory
          cd lighthouse-backend-testnet
          
          # Stop existing containers
          sudo docker-compose down || true
          
          # Remove old images
          sudo docker rmi lighthouse-backend:latest || true

          # Clone or pull the repository
          echo "Current directory: $(pwd)"
          echo "Git directory exists: $([ -d ".git" ] && echo "YES" || echo "NO")"
          if [ ! -d ".git" ]; then
            echo "Cloning repository..."
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN_DEPLOY }}@github.com/Vanssh-k/testnet-pipeline.git .
          else
            echo "Pulling latest changes..."
            # Configure git to use token for all operations
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN_DEPLOY }}@github.com/Vanssh-k/testnet-pipeline.git
            git fetch origin
            git reset --hard origin/development
          fi
          # Start services using docker-compose
          sudo docker-compose up -d --build
          
          echo "Deployment completed successfully!"
          EOF
          
          # Create directory on server first
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo mkdir -p lighthouse-backend-testnet && sudo chown ubuntu:ubuntu lighthouse-backend-testnet"
          
          # Copy deployment script to server
          scp -o StrictHostKeyChecking=no -i private_key deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          
          # Execute deployment on server using the SSH key file
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSHEOF'
            # Make deployment script executable and run
            chmod +x /tmp/deploy.sh
            
            # Export environment variables for the deployment
            export PORT=${{ secrets.PORT }}
            export ENVIRONMENT=${{ secrets.ENVIRONMENT }}
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export TEST_WALLET1_PRIVATE_KEY=${{ secrets.TEST_WALLET1_PRIVATE_KEY }}
            export TEST_WALLET2_PRIVATE_KEY=${{ secrets.TEST_WALLET2_PRIVATE_KEY }}
            export TEST_WALLET3_PRIVATE_KEY=${{ secrets.TEST_WALLET3_PRIVATE_KEY }}
            export TEST_WALLET4_PRIVATE_KEY=${{ secrets.TEST_WALLET4_PRIVATE_KEY }}
            export TEST_WALLET5_PRIVATE_KEY=${{ secrets.TEST_WALLET5_PRIVATE_KEY }}
            export TEST_WALLET6_PRIVATE_KEY=${{ secrets.TEST_WALLET6_PRIVATE_KEY }}
            export TEST_WALLET6_API_KEY=${{ secrets.TEST_WALLET6_API_KEY }}
            export TEST_WALLET7_API_KEY=${{ secrets.TEST_WALLET7_API_KEY }}
            export TEST_WALLET7_API_KEY_DEVELOPMENT=${{ secrets.TEST_WALLET7_API_KEY_DEVELOPMENT }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            export LIGHTHOUSE_IPNS_NODE=${{ secrets.LIGHTHOUSE_IPNS_NODE }}
            export LIGHTHOUSE_PUBLIC_NODE_TOKEN=${{ secrets.LIGHTHOUSE_PUBLIC_NODE_TOKEN }}
            export ROUTE_ACCESS_TOKEN=${{ secrets.ROUTE_ACCESS_TOKEN }}
            export TRANSACTION_ROUTE_TOKEN=${{ secrets.TRANSACTION_ROUTE_TOKEN }}
            export POLYGON_RPC=${{ secrets.POLYGON_RPC }}
            export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            export REDIS_URL=${{ secrets.REDIS_URL }}
            export LIGHTHOUSE_BILLING_ADDRESS=${{ secrets.LIGHTHOUSE_BILLING_ADDRESS }}
            export LIGHTHOUSE_ENC_MESSAGE_TOKENS=${{ secrets.LIGHTHOUSE_ENC_MESSAGE_TOKENS }}
            export SMTP_EMAIL_HOST=${{ secrets.SMTP_EMAIL_HOST }}
            export SMTP_EMAIL_PASSWORD=${{ secrets.SMTP_EMAIL_PASSWORD }}
            export SMTP_EMAIL_ID=${{ secrets.SMTP_EMAIL_ID }}
            export STRIPE_KEY=${{ secrets.STRIPE_KEY }}
            export PAYMENT_URL=${{ secrets.PAYMENT_URL }}
            export STRIPE_WEBHOOK=${{ secrets.STRIPE_WEBHOOK }}
            export LIGHTHOUSE_COREUM_ADDRESS=${{ secrets.LIGHTHOUSE_COREUM_ADDRESS }}
            export FILECOIN_RPC=${{ secrets.FILECOIN_RPC }}
            export RADIX_DAPP_DEFINATION=${{ secrets.RADIX_DAPP_DEFINATION }}
            export RADIX_NETWORK_ID=${{ secrets.RADIX_NETWORK_ID }}
            export RADIX_EXPECTED_ORIGIN=${{ secrets.RADIX_EXPECTED_ORIGIN }}
            export LIGHTHOUSE_RADIX_ADDRESS=${{ secrets.LIGHTHOUSE_RADIX_ADDRESS }}
            
            /tmp/deploy.sh
          SSHEOF

      - name: Health check
        run: |
          sleep 30
          
          # Check Docker containers status
          echo "Checking Docker containers status..."
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DOCKER_CHECK'
            cd lighthouse-backend-testnet
            
            # Check if our docker-compose containers are running
            if ! sudo docker-compose ps --services | xargs -I {} sudo docker-compose ps {} | grep -q "Up"; then
              echo "ERROR: Our Docker containers are not running!"
              sudo docker-compose ps
              exit 1
            fi
            
            # Check our container health status
            echo "Our container status:"
            sudo docker-compose ps
            
            # Check for any of our containers in unhealthy state
            if sudo docker-compose ps | grep -E "(unhealthy|Exit|Restarting)" | grep -v "Paused"; then
              echo "ERROR: Some of our containers are unhealthy or have exited!"
              sudo docker-compose logs --tail=50
              exit 1
            fi
            
            # Verify all our services are running
            expected_services=$(sudo docker-compose config --services)
            running_services=$(sudo docker-compose ps --services --filter "status=running")
            
            if [ "$expected_services" != "$running_services" ]; then
              echo "ERROR: Not all expected services are running!"
              echo "Expected services: $expected_services"
              echo "Running services: $running_services"
              exit 1
            fi
            
            echo "All our Docker containers are running and healthy!"
          DOCKER_CHECK
          
          # Check application health endpoint
          echo "Checking application health endpoint..."
          curl -f http://${{ secrets.SSH_HOST }}:8081/health || exit 1 