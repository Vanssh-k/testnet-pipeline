worker_processes  1;

events {
    worker_connections  10240;
}

http {
    lua_shared_dict my_limit_store 10m;

    init_by_lua_block {
        local limit_req = require "resty.limit.req"
        limit_req_inst, err = limit_req.new("my_limit_store", 10, 20)
        if not limit_req_inst then
            error("failed to instantiate limiter: " .. err)
        end

        whitelist_ips = {
            ["203.0.113.10"] = true,
        }

        whitelist_domains = {
            ["trusted-domain.com"] = true,
        }
    }

    upstream backend_upstream {
        server lighthouse-backend:13001;
    }

    server {
        listen 80;

        location / {
            access_by_lua_block {
                local remote_ip = ngx.var.remote_addr
                local origin = ngx.req.get_headers()["Origin"]

                local origin_host = origin and origin:match("https?://([^/]+)")
                local is_whitelisted_ip = whitelist_ips[remote_ip]
                local is_whitelisted_domain = origin_host and whitelist_domains[origin_host]

                if is_whitelisted_ip or is_whitelisted_domain then
                    return
                end

                local delay, err = limit_req_inst:incoming(remote_ip, true)
                if not delay then
                    ngx.status = 429
                    ngx.say("429 Too Many Requests")
                    return ngx.exit(429)
                end

                if delay > 0 then
                    ngx.sleep(delay)
                end
            }

            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
